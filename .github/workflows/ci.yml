name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.12"
      - name: Install API dependencies
        run: python -m pip install -e "apps/api[dev]"
      - name: Lint API
        run: python -m ruff check apps/api
      - name: Test API
        run: python -m pytest apps/api

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: actions/setup-node@v6.4.0
        with:
          node-version: "24"
          cache: npm
      - name: Install web dependencies
        run: npm ci
      - name: Lint web
        run: npm run lint
      - name: Typecheck web and package
        run: npm run typecheck
      - name: Test web and package
        run: npm test
      - name: Build web and package
        run: npm run build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
      - name: Build API container without inference extras
        run: docker build -f infra/docker/api.Dockerfile --build-arg API_EXTRAS= -t privacy-filter-api:core .
      - name: Build and smoke test web container assets
        run: |
          set -euo pipefail

          docker build -f infra/docker/web.Dockerfile -t privacy-filter-web:ci .
          container_id="$(docker run --detach --publish 127.0.0.1:3012:3000 privacy-filter-web:ci)"
          cleanup() {
            docker rm --force "$container_id" >/dev/null
          }
          trap cleanup EXIT

          for attempt in {1..30}; do
            if curl --fail --silent --show-error http://127.0.0.1:3012/ >/dev/null; then
              break
            fi
            if [[ "$attempt" -eq 30 ]]; then
              docker logs "$container_id"
              exit 1
            fi
            sleep 1
          done

          curl --fail --silent --show-error --head http://127.0.0.1:3012/logo.png
          curl --fail --silent --show-error --head http://127.0.0.1:3012/apple-touch-icon.png
