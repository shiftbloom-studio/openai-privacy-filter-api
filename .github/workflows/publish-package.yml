name: Publish package

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: actions/setup-node@v6.4.0
        with:
          node-version: "24"
          cache: npm
          registry-url: "https://registry.npmjs.org"
      - name: Install dependencies
        run: npm ci
      - name: Test package
        run: npm run test --workspace @shiftbloom-studio/privacy-filter
      - name: Verify npm token (manual dispatch only)
        if: github.event_name == 'workflow_dispatch'
        run: npm whoami
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_AUTH_TOKEN }}
      - name: Publish to npm (skips when the version already exists)
        run: |
          set -euo pipefail
          version="$(node -p "require('./packages/privacy-filter/package.json').version")"
          if npm view "@shiftbloom-studio/privacy-filter@${version}" version >/dev/null 2>&1; then
            echo "@shiftbloom-studio/privacy-filter@${version} is already on npm — nothing to do."
            exit 0
          fi
          npm publish --workspace @shiftbloom-studio/privacy-filter --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_AUTH_TOKEN }}
