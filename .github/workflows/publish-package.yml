name: Publish package

# Publishes @shiftbloom-studio/privacy-filter to npm with trusted publishing
# (OIDC). No npm token is stored in this repository. The trusted publisher on
# npmjs.com must point at this repository and this workflow file name.
#
# Release flow: bump "version" in packages/privacy-filter/package.json on main,
# then publish a GitHub release (for example v0.2.0). Re-running for a version
# that is already on npm is a no-op.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-package
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 26
          cache: npm
          registry-url: "https://registry.npmjs.org"
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Typecheck package
        run: npm run typecheck --workspace @shiftbloom-studio/privacy-filter
      - name: Test package
        run: npm run test --workspace @shiftbloom-studio/privacy-filter
      - name: Publish to npm (skips when the version already exists)
        run: |
          set -euo pipefail
          version="$(node -p "require('./packages/privacy-filter/package.json').version")"
          if npm view "@shiftbloom-studio/privacy-filter@${version}" version >/dev/null 2>&1; then
            echo "@shiftbloom-studio/privacy-filter@${version} is already on npm, nothing to do."
            exit 0
          fi
          npm publish --workspace @shiftbloom-studio/privacy-filter --access public --provenance
