name: Deploy AWS

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      target:
        description: Deployment target to run.
        required: true
        default: all
        type: choice
        options:
          - all
          - api
          - web
          - auto
      runtime:
        description: Web runtime to build. The Shiftbloom deployment uses browser.
        required: true
        default: browser
        type: choice
        options:
          - browser
          - server

permissions:
  contents: read

concurrency:
  group: aws-app-runner-${{ github.ref }}
  cancel-in-progress: false

# Optional deployment for self-hosters with inference compute. The Shiftbloom
# deployment is a static, browser-only build on Cloudflare Workers, so this
# workflow does nothing unless the repository variables below are set.
# Configure them under Settings -> Secrets and variables -> Actions -> Variables.

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'eu-central-1' }}
  AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
  AWS_ROLE_TO_ASSUME: ${{ vars.AWS_ROLE_TO_ASSUME }}
  API_ECR_REPOSITORY: ${{ vars.API_ECR_REPOSITORY || 'privacy-filter-api' }}
  WEB_ECR_REPOSITORY: ${{ vars.WEB_ECR_REPOSITORY || 'privacy-filter-web' }}
  API_APP_RUNNER_SERVICE_ARN: ${{ vars.API_APP_RUNNER_SERVICE_ARN }}
  WEB_APP_RUNNER_SERVICE_ARN: ${{ vars.WEB_APP_RUNNER_SERVICE_ARN }}
  MODEL_ARTIFACT_BUCKET: ${{ vars.MODEL_ARTIFACT_BUCKET }}

jobs:
  detect-changes:
    name: Detect changed surfaces
    if: vars.AWS_ROLE_TO_ASSUME != ''
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.detect.outputs.api }}
      web: ${{ steps.detect.outputs.web }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Detect changed paths
        id: detect
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          TARGET: ${{ github.event_name == 'workflow_dispatch' && inputs.target || 'auto' }}
        run: |
          set -euo pipefail

          api=false
          web=false

          case "$TARGET" in
            all)
              api=true
              web=true
              ;;
            api)
              api=true
              ;;
            web)
              web=true
              ;;
            auto)
              if [[ "$EVENT_NAME" == "push" && -n "${BEFORE_SHA:-}" && ! "$BEFORE_SHA" =~ ^0+$ ]]; then
                git diff --name-only "$BEFORE_SHA" "$GITHUB_SHA" > changed-files.txt
              else
                parent="$(git rev-parse "${GITHUB_SHA}^" 2>/dev/null || true)"
                if [[ -n "$parent" ]]; then
                  git diff --name-only "$parent" "$GITHUB_SHA" > changed-files.txt
                else
                  git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA" > changed-files.txt
                fi
              fi

              while IFS= read -r file; do
                case "$file" in
                  apps/api/*|infra/docker/api.Dockerfile|privacy-filter-model/*)
                    api=true
                    ;;
                  apps/web/*|infra/docker/web.Dockerfile|package.json|package-lock.json)
                    web=true
                    ;;
                  .dockerignore)
                    api=true
                    web=true
                    ;;
                esac
              done < changed-files.txt
              ;;
            *)
              echo "Unknown target: $TARGET" >&2
              exit 2
              ;;
          esac

          echo "api=$api" >> "$GITHUB_OUTPUT"
          echo "web=$web" >> "$GITHUB_OUTPUT"
          {
            echo "### Deployment target detection"
            echo ""
            echo "- Requested target: \`$TARGET\`"
            echo "- Deploy API: \`$api\`"
            echo "- Deploy web: \`$web\`"
            if [[ -f changed-files.txt ]]; then
              echo ""
              echo "Changed files:"
              sed 's/^/- `/' changed-files.txt | sed 's/$/`/'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  deploy-api:
    name: Deploy API
    runs-on: ubuntu-latest
    needs: detect-changes
    permissions:
      contents: read
      id-token: write
    if: needs.detect-changes.outputs.api == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.15"

      - name: Install API dependencies
        run: |
          python -m pip install --only-binary :all: --require-hashes -r apps/api/requirements-dev.txt

      - name: Lint API
        run: python -m ruff check apps/api

      - name: Test API
        run: python -m pytest apps/api

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@45666896f5d8e0f10ae255413f3a4cdd03bdc8f5 # v6.3.1
        with:
          role-to-assume: ${{ env.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@7290e214a610b32bc0eef81748948b6d466a8783 # v2.2.0

      - name: Restore baked model artifacts
        run: |
          set -euo pipefail
          aws s3 sync "s3://${MODEL_ARTIFACT_BUCKET}/models/openai-privacy-filter/" privacy-filter-model/
          for file in config.json model.safetensors tokenizer.json tokenizer_config.json viterbi_calibration.json; do
            test -s "privacy-filter-model/$file"
          done

      - name: Build and push API image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          set -euo pipefail
          image_uri="${ECR_REGISTRY}/${API_ECR_REPOSITORY}:${GITHUB_SHA}"
          latest_uri="${ECR_REGISTRY}/${API_ECR_REPOSITORY}:latest"
          docker build --platform linux/amd64 -f infra/docker/api.Dockerfile -t "$image_uri" -t "$latest_uri" .
          docker push "$image_uri"
          docker push "$latest_uri"
          echo "API_IMAGE_URI=$image_uri" >> "$GITHUB_ENV"

      - name: Deploy API App Runner service
        run: .github/scripts/deploy-apprunner-image.sh "$API_APP_RUNNER_SERVICE_ARN" "$API_IMAGE_URI"

  deploy-web:
    name: Deploy Web
    runs-on: ubuntu-latest
    needs: detect-changes
    permissions:
      contents: read
      id-token: write
    if: needs.detect-changes.outputs.web == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Node
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 26
          cache: npm

      - name: Install web dependencies
        run: npm ci --ignore-scripts

      - name: Lint web
        run: npm --workspace apps/web run lint

      - name: Typecheck web
        run: npm --workspace apps/web run typecheck

      - name: Test web
        run: npm --workspace apps/web run test

      - name: Build web
        env:
          NEXT_PUBLIC_PRIVACY_FILTER_RUNTIME: ${{ github.event_name == 'workflow_dispatch' && inputs.runtime || 'browser' }}
        run: npm --workspace apps/web run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@45666896f5d8e0f10ae255413f3a4cdd03bdc8f5 # v6.3.1
        with:
          role-to-assume: ${{ env.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@7290e214a610b32bc0eef81748948b6d466a8783 # v2.2.0

      - name: Build and push web image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          set -euo pipefail
          image_uri="${ECR_REGISTRY}/${WEB_ECR_REPOSITORY}:${GITHUB_SHA}"
          latest_uri="${ECR_REGISTRY}/${WEB_ECR_REPOSITORY}:latest"
          docker build --platform linux/amd64 -f infra/docker/web.Dockerfile -t "$image_uri" -t "$latest_uri" .
          docker push "$image_uri"
          docker push "$latest_uri"
          echo "WEB_IMAGE_URI=$image_uri" >> "$GITHUB_ENV"

      - name: Deploy web App Runner service
        run: .github/scripts/deploy-apprunner-image.sh "$WEB_APP_RUNNER_SERVICE_ARN" "$WEB_IMAGE_URI"

  no-deploy:
    name: No deploy needed
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.api != 'true' && needs.detect-changes.outputs.web != 'true'
    steps:
      - name: Report skipped deployment
        run: echo "No API or web deployment paths changed."
