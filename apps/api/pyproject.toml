[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "privacy-filter-api"
version = "0.1.0"
description = "FastAPI wrapper for openai/privacy-filter."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.128.0",
  "mangum==0.21.0",
  "uvicorn[standard]"
]

[project.optional-dependencies]
dev = [
  "httpx",
  "pytest",
  "ruff"
]
inference = [
  "torch",
  "transformers>=5.8.0,<6.0.0"
]

[tool.hatch.build.targets.wheel]
packages = ["src/privacy_filter_api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]

